name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20']

    # A throwaway PostgreSQL the tests reset to a known state on each run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fenrir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fenrir_test
      JWT_SECRET: ci-test-secret
      # The "fenrir_test" database name satisfies the test reset safeguard.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database schema
        run: npm run migrate

      - name: Import the bundled seed (offline)
        run: npm run scrape -- --offline

      - name: Run the test suite
        run: npm test
