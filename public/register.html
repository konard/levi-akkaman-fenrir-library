<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — Fenrir Library</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="container">
    <div class="auth-wrap card-panel">
      <h1>Join the library</h1>
      <p class="muted">Create a free account to comment and react.</p>
      <div id="form-error"></div>
      <form id="register-form">
        <div class="field">
          <label for="name">Display name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>
          <div class="hint">At least 6 characters.</div>
        </div>
        <button class="btn block" type="submit">Create account</button>
      </form>
      <p class="muted" style="margin-top:1rem">Already a member? <a href="/login.html">Log in</a>.</p>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
